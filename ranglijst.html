<!DOCTYPE html>
<html lang="nl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stand Hoofdklasse JO14-1</title>
    <!-- Tailwind CSS voor een strak uiterlijk -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: transparent;
            font-family: 'Segoe UI', Arial, sans-serif;

<body class="max-w-md mx-auto">

                    </tr>
                    <tr class="hover:bg-gray-50">

                        <td class="py-2 px-3 font-medium text-gray-800">Robur e.s 014-1</td>
                        <td class="py-2 px-3 text-center text-gray-600">3</td>
                        <td class="py-2 px-3 text-center font-bold text-blue-900">6</td>

                    <tr class="hover:bg-gray-50">
