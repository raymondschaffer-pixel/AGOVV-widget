<body class="max-w-md mx-auto space-y-5">

                    </tr>
                    <tr class="hover:bg-gray-50 bg-blue-50/50">
                        <td class="py-2 px-3 font-semibold text-gray-600">2</td>
                        <td class="py-2 px-3 font-bold text-blue-900">AGOVV 014-1</td>
                        <td class="py-2 px-3 text-center text-gray-600">3</td>
                        <td class="py-2 px-3 text-center font-bold text-blue-900">6</td>
                        <td class="py-2 px-3 text-center text-green-600">+2</td>
                    </tr>
                    <tr class="hover:bg-gray-50">
                        <td class="py-2 px-3 font-semibold text-gray-600">3</td>
                        <td class="py-2 px-3 font-medium text-gray-800">Robur e.s 014-1</td>
                        <td class="py-2 px-3 text-center text-gray-600">3</td>
                        <td class="py-2 px-3 text-center font-bold text-blue-900">6</td>
                        <td class="py-2 px-3 text-center text-green-600">+1</td>
                    </tr>
                    <tr class="hover:bg-gray-50">
                        <td class="py-2 px-3 font-semibold text-gray-600">4</td>
                        <td class="py-2 px-3 font-medium text-gray-800">SV CCW '16 014-1JM</td>
                        <td class="py-2 px-3 text-center text-gray-600">2</td>
                        <td class="py-2 px-3 text-center font-bold text-blue-900">3</td>

                    </tr>

    <!-- SECTIE 2: PROGRAMMA VIA ICAL -->
    <div class="bg-white shadow-lg rounded-xl overflow-hidden border border-gray-100">
        <div class="bg-blue-900 text-white px-4 py-3 font-bold text-base flex justify-between items-center">
            <span>📅 Programma JO14-1</span>
            <span class="text-[10px] bg-blue-700 px-2 py-0.5 rounded uppercase tracking-wider">Live iCal</span>
        </div>
        
        <div id="agenda-list" class="divide-y divide-gray-100 p-4 text-sm">
            <p class="text-gray-500 text-center py-2 text-xs">Agenda inladen...</p>
        </div>
    </div>

    <script>
        const ICAL_URL = 'https://data.sportlink.com/ical-team?token=lpf6dfk6m1uv2o6uno5m0i4b3n'; 

        async function loadCalendar() {
            const container = document.getElementById('agenda-list');

            try {
                const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(ICAL_URL)}`;
                const response = await fetch(proxyUrl);
                
                if (!response.ok) throw new Error("Kon data niet ophalen");
                const icalText = await response.text();
                
                if (!icalText.includes('BEGIN:VCALENDAR')) {
                    throw new Error("Geen geldige iCal data ontvangen");
                }

                const jcalData = ICAL.parse(icalText);
                const vcalendar = new ICAL.Component(jcalData);
                const events = vcalendar.getAllSubcomponents('vevent');

                const now = new Date();
                let html = '';
                let count = 0;

                const parsedEvents = events.map(e => {
                    const event = new ICAL.Event(e);
                    return {
                        summary: event.summary,
                        startDate: event.startDate.toJSDate(),
                        location: event.location || 'Locatie n.t.b.'
                    }
                }).sort((a, b) => a.startDate - b.startDate);

                for (const ev of parsedEvents) {
                    if (ev.startDate >= new Date(now.getTime() - 86400000) && count < 5) {
                        const dateStr = ev.startDate.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
                        const timeStr = ev.startDate.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });

                        html += `
                            <div class="py-2.5 flex flex-col justify-between border-b border-gray-100 last:border-b-0">
                                <div class="flex justify-between items-center mb-0.5">
                                    <span class="text-[11px] font-semibold text-blue-600 uppercase tracking-wider">${dateStr} om ${timeStr}</span>
                                </div>
                                <div class="text-gray-800 font-bold text-xs sm:text-sm mb-1">${ev.summary}</div>
                                <div class="text-gray-400 text-[11px] flex items-center">📍 ${ev.location}</div>
                            </div>
                        `;
                        count++;
                    }
                }

                if (html === '') {
                    container.innerHTML = `<p class="text-gray-500 text-xs text-center py-2">Geen aankomende wedstrijden gevonden.</p>`;
                } else {
                    container.innerHTML = html;
                }

            } catch (error) {
                console.error(error);
                container.innerHTML = `<p class="text-red-500 text-xs text-center py-2">Fout bij het laden van het iCal-programma.</p>`;
            }
        }

        loadCalendar();
    </script>
</body>
</html>
