<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stand Hoofdklasse JO14-1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: transparent;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 5px;
        }
        .watermark-container {
            position: relative;
            background-image: url('https://cdn.jsdelivr.net/gh/raymondschaffer-pixel/AGOVV-widget@main/agovv-logo.jpeg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 60%;
        }
        .watermark-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.92);
            pointer-events: none;
            z-index: 1;
        }
        .content-layer {
            position: relative;
            z-index: 2;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinning {
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body class="max-w-md mx-auto">

    <div class="bg-white shadow-md rounded-xl overflow-hidden border border-gray-100 watermark-container">
        <div class="content-layer">
            <div class="bg-blue-900 text-white px-3 py-2 font-bold text-sm flex justify-between items-center shadow-sm">
                <span>🏆 Stand Hoofdklasse JO14</span>
                
                <button onclick="laadEnBerekenStand()" id="updateBtn" class="bg-blue-700 hover:bg-blue-600 text-white text-[10px] px-2.5 py-1 rounded-md uppercase tracking-wider font-semibold transition flex items-center gap-1 shadow-sm cursor-pointer">
                    <svg id="updateIcoon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.63-5.38"></path>
                    </svg>
                    Update
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-gray-50/80 text-gray-500 border-b border-gray-100 uppercase text-[9px]">
                            <th class="py-1.5 px-2">#</th>
                            <th class="py-1.5 px-2">Team</th>
                            <th class="py-1.5 px-2 text-center">G</th>
                            <th class="py-1.5 px-2 text-center">Ptn</th>
                            <th class="py-1.5 px-2 text-center">Saldo</th>
                        </tr>
                    </thead>
                    <tbody id="stand-tabel-body" class="divide-y divide-gray-100/80">
                        <tr>
                            <td colspan="5" class="py-3 text-center text-gray-400">Stand berekenen...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function laadEnBerekenStand() {
            const icoon = document.getElementById('updateIcoon');
            const btn = document.getElementById('updateBtn');
            icoon.classList.add('spinning');
            btn.style.opacity = '0.8';

            try {
                // Haal uitslagen.txt op met een timestamp om caching te voorkomen
                const response = await fetch('uitslagen.txt?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Kon uitslagen.txt niet laden");
                
                const tekst = await response.text();
                const regels = tekst.split('\n').map(r => r.trim()).filter(Boolean);

                // Object om per team de stats bij te houden: { gespeeld, punten, voor, tegen }
                const teams = {};

                function zorgDatTeamBestaat(naam) {
                    if (!teams[naam]) {
                        teams[naam] = { naam: naam, gespeeld: 0, punten: 0, voor: 0, tegen: 0 };
                    }
                }

                // Verwerk alle regels uit uitslagen.txt
                regels.forEach(regel => {
                    const delen = regel.split('|').map(d => d.trim());
                    if (delen.length === 4) {
                        const thuisTeam = delen[0];
                        const thuisScore = parseInt(delen[1], 10);
                        const uitScore = parseInt(delen[2], 10);
                        const uitTeam = delen[3];

                        zorgDatTeamBestaat(thuisTeam);
                        zorgDatTeamBestaat(uitTeam);

                        teams[thuisTeam].gespeeld++;
                        teams[uitTeam].gespeeld++;

                        teams[thuisTeam].voor += thuisScore;
                        teams[thuisTeam].tegen += uitScore;
                        teams[uitTeam].voor += uitScore;
                        teams[uitTeam].tegen += thuisScore;

                        if (thuisScore > uitScore) {
                            teams[thuisTeam].punten += 3;
                        } else if (thuisScore < uitScore) {
                            teams[uitTeam].punten += 3;
                        } else {
                            teams[thuisTeam].punten += 1;
                            teams[uitTeam].punten += 1;
                        }
                    }
                });

                // Converteer naar array en sorteer (op Punten -> Doelsaldo -> Doelpunten voor)
                const ranglijst = Object.values(teams).sort((a, b) => {
                    const saldoA = a.voor - a.tegen;
                    const saldoB = b.voor - b.tegen;

                    if (b.punten !== a.punten) return b.punten - a.punten;
                    if (saldoB !== saldoA) return saldoB - saldoA;
                    return b.voor - a.voor;
                });

                // Bouw de HTML voor de tabel
                let html = '';
                ranglijst.forEach((t, index) => {
                    const positie = index + 1;
                    const saldo = t.voor - t.tegen;
                    const saldoTekst = saldo > 0 ? `+${saldo}` : `${saldo}`;
                    const saldoKleur = saldo > 0 ? 'text-green-600' : (saldo < 0 ? 'text-red-500' : 'text-gray-600');
                    
                    // Extra accent voor AGOVV
                    const isAgovv = t.naam.toLowerCase().includes('agovv');
                    const rijStijl = isAgovv ? 'bg-blue-50/30' : 'hover:bg-gray-50/50';
                    const naamStijl = isAgovv ? 'font-bold text-blue-900' : 'font-medium text-gray-800';

                    html += `
                        <tr class="${rijStijl}">
                            <td class="py-1.5 px-2 font-semibold text-gray-600">${positie}</td>
                            <td class="py-1.5 px-2 ${naamStijl}">${t.naam}</td>
                            <td class="py-1.5 px-2 text-center text-gray-600">${t.gespeeld}</td>
                            <td class="py-1.5 px-2 text-center font-bold text-blue-900">${t.punten}</td>
                            <td class="py-1.5 px-2 text-center ${saldoKleur}">${saldoTekst}</td>
                        </tr>
                    `;
                });

                if (ranglijst.length === 0) {
                    html = `<tr><td colspan="5" class="py-3 text-center text-gray-400">Geen uitslagen gevonden in uitslagen.txt</td></tr>`;
                }

                document.getElementById('stand-tabel-body').innerHTML = html;

            } catch (error) {
                console.error(error);
                document.getElementById('stand-tabel-body').innerHTML = `<tr><td colspan="5" class="py-3 text-center text-red-500">Fout bij laden van uitslagen</td></tr>`;
            } finally {
                setTimeout(() => {
                    icoon.classList.remove('spinning');
                    btn.style.opacity = '1';
                }, 500);
            }
        }

        // Laad de stand direct bij openen
        laadEnBerekenStand();
    </script>
</body>
</html>
