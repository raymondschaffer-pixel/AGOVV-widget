<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stand Hoofdklasse JO14-1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: transparent;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 5px;
        }
        /* Achtergrondlogo met transparantie watermerk effect */
        .watermark-container {
            position: relative;
            background-image: url('https://cdn.jsdelivr.net/gh/raymondschaffer-pixel/AGOVV-widget@main/agovv-logo.jpeg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 60%;
        }
        /* Een lichte witte deken over de tabel zodat letters haarscherp blijven */
        .watermark-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.92);
            pointer-events: none;
            z-index: 1;
        }
        /* Zorg dat alle inhoud boven het watermerk komt te staan */
        .content-layer {
            position: relative;
            z-index: 2;
        }
        /* Animatie voor de update knop */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinning {
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body class="max-w-md mx-auto">

    <div class="bg-white shadow-md rounded-xl overflow-hidden border border-gray-100 watermark-container">
        <div class="content-layer">
            <div class="bg-blue-900 text-white px-3 py-2 font-bold text-sm flex justify-between items-center shadow-sm">
                <span>🏆 Stand Hoofdklasse JO14</span>
                
                <!-- Interactieve Update Knop -->
                <button onclick="verversStand()" id="updateBtn" class="bg-blue-700 hover:bg-blue-600 text-white text-[10px] px-2.5 py-1 rounded-md uppercase tracking-wider font-semibold transition flex items-center gap-1 shadow-sm cursor-pointer">
                    <svg id="updateIcoon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.63-5.38"></path>
                    </svg>
                    Update
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-gray-50/80 text-gray-500 border-b border-gray-100 uppercase text-[9px]">
                            <th class="py-1.5 px-2">#</th>
                            <th class="py-1.5 px-2">Team</th>
                            <th class="py-1.5 px-2 text-center">G</th>
                            <th class="py-1.5 px-2 text-center">Ptn</th>
                            <th class="py-1.5 px-2 text-center">Saldo</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100/80">
                        <!-- Pas hieronder wekelijks simpel de cijfers aan na de speelronde (G - Ptn - Saldo) -->
                        <tr class="hover:bg-gray-50/50">
                            <td class="py-1.5 px-2 font-semibold text-gray-600">1</td>
                            <td class="py-1.5 px-2 font-medium text-gray-800">ESA 014-1</td>
                            <td class="py-1.5 px-2 text-center text-gray-600">2</td>
                            <td class="py-1.5 px-2 text-center font-bold text-blue-900">6</td>
                            <td class="py-1.5 px-2 text-center text-green-600">+6</td>
                        </tr>
                        <tr class="hover:bg-gray-50/50 bg-blue-50/30">
                            <td class="py-1.5 px-2 font-semibold text-gray-600">2</td>
                            <td class="py-1.5 px-2 font-bold text-blue-900">AGOVV 014-1</td>
                            <td class="py-1.5 px-2 text-center text-gray-600">3</td>
                            <td class="py-1.5 px-2 text-center font-bold text-blue-900">6</td>
                            <td class="py-1.5 px-2 text-center text-green-600">+2</td>
                        </tr>
                        <tr class="hover:bg-gray-50/50">
                            <td class="py-1.5 px-2 font-semibold text-gray-600">3</td>
                            <td class="py-1.5 px-2 font-medium text-gray-800">Robur e.s 014-1</td>
                            <td class="py-1.5 px-2 text-center text-gray-600">3</td>
                            <td class="py-1.5 px-2 text-center font-bold text-blue-900">6</td>
                            <td class="py-1.5 px-2 text-center text-green-600">+1</td>
                        </tr>
                        <tr class="hover:bg-gray-50/50">
                            <td class="py-1.5 px-2 font-semibold text-gray-600">4</td>
                            <td class="py-1.5 px-2 font-medium text-gray-800">SV CCW '16 014-1JM</td>
                            <td class="py-1.5 px-2 text-center text-gray-600">2</td>
                            <td class="py-1.5 px-2 text-center font-bold text-blue-900">3</td>
                            <td class="py-1.5 px-2 text-center text-green-600">+2</td>
                        </tr>
                        <tr class="hover:bg-gray-50/50">
                            <td class="py-1.5 px-2 font-semibold text-gray-600">5</td>
                            <td class="py-1.5 px-2 font-medium text-gray-800">FC Zutphen 014-1JM</td>
                            <td class="py-1.5 px-2 text-center text-gray-600">2</td>
                            <td class="py-1.5 px-2 text-center font-bold text-blue-900">0</td>
                            <td class="py-1.5 px-2 text-center text-red-500">-5</td>
                        </tr>
                        <tr class="hover:bg-gray-50/50">
                            <td class="py-1.5 px-2 font-semibold text-gray-600">6</td>
                            <td class="py-1.5 px-2 font-medium text-gray-800">WSV 014-2</td>
                            <td class="py-1.5 px-2 text-center text-gray-600">2</td>
                            <td class="py-1.5 px-2 text-center font-bold text-blue-900">0</td>
                            <td class="py-1.5 px-2 text-center text-red-500">-6</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function verversStand() {
            const icoon = document.getElementById('updateIcoon');
            const btn = document.getElementById('updateBtn');
            
            // Laat de knop even draaien als teken van actie
            icoon.classList.add('spinning');
            btn.style.opacity = '0.8';

            setTimeout(() => {
                // Herlaadt de pagina en dwingt de browser om verse data op te halen (omzeilt cache)
                window.location.reload(true);
            }, 600);
        }
    </script>
</body>
</html>
