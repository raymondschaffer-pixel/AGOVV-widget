<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGOVV JO14-1</title>

<style>

body{
    margin:0;
    padding:10px;
    background:#eef3f7;
    font-family:'Segoe UI', Arial, sans-serif;
}

.container{
    width:100%;
    max-width:400px;
    margin:0 auto;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.logo{
    width:180px;
    max-width:100%;
    height:auto;
    border-radius:18px;
    box-shadow:0 6px 18px rgba(0,0,0,0.15);
}

.teamtitel{
    color:#0099d8;
    font-size:24px;
    font-weight:800;
    margin-top:12px;
}

.subtitel{
    color:#666;
    font-size:15px;
    margin-top:5px;
}

.wedstrijd{
    background:white;
    border:3px solid #0099d8;
    border-radius:18px;
    padding:20px;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.badge{
    display:inline-block;
    background:#0099d8;
    color:white;
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:15px;
}

.datum{
    text-align:center;
    color:#00a651;
    font-size:18px;
    font-weight:700;
    margin-bottom:15px;
}

.team{
    text-align:center;
    font-size:20px;
    font-weight:700;
    line-height:1.4;
}

.vs{
    text-align:center;
    color:#888;
    margin:10px 0;
}

.tijd{
    text-align:center;
    font-size:52px;
    font-weight:800;
    color:#000;
    margin:10px 0;
}

.locatie{
    text-align:center;
    font-size:14px;
    color:#555;
    margin-top:15px;
}

</style>

</head>
<body>

<div class="container">

    <div class="header">

        <img
            src="https://raymondschaffer-pixel.ogo.jpeg"
            class="logo"
            alt="AGOVV JO14-1 Logo">

        <div class="teamtitel">
            ⚽ AGOVV JO14-1
        </div>

        <div class="subtitel">
            Volgende wedstrijd
        </div>

    </div>

    <div class="wedstrijd">

        <div class="badge">
            VOLGENDE WEDSTRIJD
        </div>

        <div class="datum">
            📅 Zaterdag 5 september
        </div>

        <div class="team">
            WSV O14-2
        </div>

        <div class="vs">
            VS
        </div>

        <div class="tijd">
            13:00
        </div>

        <div class="team">
            AGOVV O14-1
        </div>

        <div class="locatie">
            📍 Sportpark De Voorwaarts, Apeldoorn
        </div>

    </div>

</div>

</body>
</html>
