<style>
body{
    margin:0;
    padding:10px;
    background:#ffffff;
    font-family:'Segoe UI', Arial, sans-serif;
}

.container{
    width:100%;
    max-width:400px;
    margin:0 auto;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.teamtitel{
    color:#0099d8;
    font-size:24px;
    font-weight:800;
    margin-top:12px;
}

.subtitel{
    color:#666;
    font-size:15px;
    margin-top:5px;
}

.wedstrijd{
    background:#ffffff;
    border:3px solid #0099d8;
    border-radius:18px;
    padding:20px;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.badge{
    display:inline-block;
    background:#0099d8;
    color:white;
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:15px;
}

.datum{
    text-align:center;
    color:#00a651;
    font-size:18px;
    font-weight:700;
    margin-bottom:15px;
}

.team{
    text-align:center;
    font-size:20px;
    font-weight:700;
    line-height:1.4;
}

.vs{
    text-align:center;
    color:#888;
    margin:10px 0;
}

.tijd{
    text-align:center;
    font-size:52px;
    font-weight:800;
    color:#000;
    margin:10px 0;
}

.locatie{
    text-align:center;
    font-size:14px;
    color:#555;
    margin-top:15px;
}
</style>

<div class="container">
    <div class="header">
        <div class="teamtitel">AGOVV JO14-1</div>
        <div class="subtitel">Komende wedstrijden</div>
    </div>

    <div id="wedstrijden-lijst">
        <!-- Hier worden de wedstrijden automatisch ingeladen -->
    </div>
</div>

<script>
async function laadWedstrijden() {
    try {
        // Vervang de URL hieronder door de echte raw GitHub URL van je wedstrijden.json bestand
        const response = await fetch('https://raw.githubusercontent.com/JOUW-GEBRUIKERSNAAM/JOUW-REPO/main/wedstrijden.json');
        const wedstrijden = await response.json();
        
        const vandaag = new Date();
        vandaag.setHours(0,0,0,0);

        // Filter wedstrijden die in de toekomst liggen en pak er maximaal 2
        const komendeWedstrijden = wedstrijden
            .filter(w => new Date(w.datum) >= vandaag)
            .slice(0, 2);

        const container = document.getElementById('wedstrijden-lijst');
        container.innerHTML = '';

        if (komendeWedstrijden.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#666;">Geen aankomende wedstrijden gevonden.</div>';
            return;
        }

        komendeWedstrijden.forEach(w => {
            // Datum netjes formatteren (bijv. Zaterdag 29 augustus 2026)
            const opties = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const datumStr = new Date(w.datum).toLocaleDateString('nl-NL', opties);
            // Eerste letter hoofdletter maken
            const formattedDatum = datumStr.charAt(0).toUpperCase() + datumStr.slice(1);

            const html = `
                <div class="wedstrijd">
                    <div style="text-align:center;">
                        <span class="badge">${w.type}</span>
                    </div>
                    <div class="datum">
                        ${formattedDatum}
                    </div>
                    <div class="team">
                        AGOVV JO14-1
                    </div>
                    <div class="vs">
                        VS
                    </div>
                    <div class="team">
                        ${w.tegenstander}
                    </div>
                    <div class="tijd">
                        ${w.tijd}
                    </div>
                    <div class="locatie">
                        ${w.locatie.replace(', ', '<br>')}
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });

    } catch (error) {
        console.error('Fout bij laden wedstrijden:', error);
    }
}

laadWedstrijden();
</script>
