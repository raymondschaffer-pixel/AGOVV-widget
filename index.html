<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorebord & Toegang Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body{
            margin:0;
            padding:10px;
            background:#ffffff;
            font-family:'Segoe UI', Arial, sans-serif;
        }

        .container{
            width:100%;
            max-width:420px;
            margin:0 auto;
        }

        .scoreboard{
            background-color: #0b0b0b;
            border: 4px solid #1f1f1f;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
            color: #fff;
            font-family: 'VT323', monospace;
            margin-bottom: 20px;
        }

        /* Gele LED regels boven (Regel 3 & 4) */
        .led-row-yellow {
            background-color: #171300;
            color: #ffb700;
            border: 1px solid #332600;
            border-radius: 6px;
            padding: 5px 8px;
            text-align: center;
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-shadow: 0 0 6px rgba(255,183,0,0.6);
            text-transform: uppercase;
        }

        .sub-location {
            text-align: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 12px;
            color: #aaa;
            margin: 10px 0 5px 0;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .teams-score-grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
            padding: 0 5px;
        }

        .team-name {
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            width: 32%;
            text-align: center;
            line-height: 1.2;
        }

        .score-display {
            background-color: #141414;
            border: 2px solid #282828;
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 32px;
            color: #ff3333;
            text-shadow: 0 0 8px rgba(255,51,51,0.7);
            letter-spacing: 6px;
            text-align: center;
        }

        /* Rode LED regels onder (Regel 7 & 8) */
        .led-row-red {
            background-color: #1a0505;
            color: #ff3333;
            border: 1px solid #330000;
            border-radius: 6px;
            padding: 5px 8px;
            text-align: center;
            font-size: 18px;
            letter-spacing: 2px;
            margin-top: 6px;
            text-shadow: 0 0 6px rgba(255,51,51,0.6);
            text-transform: uppercase;
        }

        /* Toegangskaart Stijlen */
        .toegang-kaart {
            background-color: #0b192c;
            color: #fff;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #1e3a5f;
            text-align: center;
            font-family: 'Roboto', sans-serif;
        }

        .logo-container {
            width: 50px;
            height: 50px;
            margin: 0 auto 12px auto;
            background-color: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
            box-sizing: border-box;
        }

        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .toegang-titel {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0 0 4px 0;
            color: #ffffff;
        }

        .toegang-subtitel {
            font-size: 0.78rem;
            color: #94a3b8;
            margin-bottom: 16px;
        }

        .input-groep {
            position: relative;
            width: 100%;
            margin-bottom: 10px;
        }

        .toegang-formulier input {
            width: 100%;
            padding: 10px 40px 10px 12px;
            border: 1px solid #334155;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.85rem;
            outline: none;
            background-color: #1e293b;
            color: #fff;
            text-align: center;
        }

        .toegang-formulier input:focus {
            border-color: #3b82f6;
        }

        .wachtwoord-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wachtwoord-toggle:hover {
            color: #ffffff;
        }

        .toegang-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .toegang-btn:hover {
            background: linear-gradient(135deg, #1e40af, #1d4ed8);
        }

        .footer-tekst {
            margin-top: 14px;
            font-size: 0.7rem;
            color: #64748b;
            border-top: 1px solid #1e293b;
            padding-top: 10px;
        }

        .fout-melding {
            color: #f87171;
            font-size: 0.75rem;
            margin-bottom: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Scorebord Gedeelte -->
        <div class="scoreboard" id="scoreboard-content">
            Laden...
        </div>

        <!-- Veilige Toegang Gedeelte -->
        <div class="toegang-kaart">
            <div class="logo-container">
                <img src="https://cdn.jsdelivr.net/gh/raymondschaffer-pixel/AGOVV-widget@main/agovv-logo.jpeg" alt="AGOVV Logo">
            </div>

            <div class="toegang-titel">Veilige Toegang</div>
            <div class="toegang-subtitel">Voer uw wachtwoord in voor de openbare documenten</div>
            
            <div class="toegang-formulier">
                <div id="foutMelding" class="fout-melding">Onjuist wachtwoord!</div>
                
                <div class="input-groep">
                    <input type="password" id="wachtwoordInput" placeholder="Wachtwoord..." />
                    <button type="button" class="wachtwoord-toggle" onclick="toggleWachtwoordZichtbaarheid()" title="Toon/Verberg wachtwoord">
                        <svg id="oogIcoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <button class="toegang-btn" onclick="verifieerWachtwoord()">VERIFIËREN</button>
            </div>

            <div class="footer-tekst">
                Vragen? Stuur uw bericht naar de Teammanager
            </div>
        </div>
    </div>

    <script>
        const HET_WACHTWOORD = 'Hetisweerzover;)';
        const DRIVE_MAP_URL = 'https://drive.google.com/drive/folders/17s2BQM_oH1Qv048DwkBqFE6q7_AhEyBx?usp=drive_link';

        async function laadScoreboard() {
            try {
                const response = await fetch('https://raymondschaffer-pixel.github.io/AGOVV-widget/wedstrijdinfo.txt?t=' + new Date().getTime());
                
                if (!response.ok) throw new Error('Kon bestand niet ophalen');
                
                const tekst = await response.text();
                const regels = tekst.split('\n').map(r => r.trim()).filter(Boolean);

                if (regels.length < 8) {
                    document.getElementById('scoreboard-content').innerHTML = '<div style="text-align:center; color:#ff3333; font-family:monospace; padding:20px;">Onvolledige data in wedstrijdinfo.txt</div>';
                    return;
                }

                const team1 = regels[0];
                const team2 = regels[1];
                const geel1 = regels[2];
                const geel2 = regels[3];
                const scoreThuis = regels[4];
                const scoreUit = regels[5];
                const rood1 = regels[6];
                const rood2 = regels[7];

                const html = `
                    <div class="led-row-yellow">${geel1}</div>
                    <div class="led-row-yellow">${geel2}</div>
                    
                    <div class="sub-location">SPORTPARK BERG EN BOS</div>
                    
                    <div style="text-align:center; margin: 4px 0;">
                        <div style="display:inline-block; width:26px; height:26px; background:#0055a5; border-radius:50%; line-height:26px; color:white; font-size:11px; font-weight:bold; font-family:sans-serif;">A</div>
                    </div>

                    <div class="teams-score-grid">
                        <div class="team-name">${team1}</div>
                        <div class="score-display">${scoreThuis}:${scoreUit}</div>
                        <div class="team-name">${team2}</div>
                    </div>

                    <div class="led-row-red">${rood1}</div>
                    <div class="led-row-red">${rood2}</div>
                `;

                document.getElementById('scoreboard-content').innerHTML = html;

            } catch (error) {
                console.error('Fout:', error);
                document.getElementById('scoreboard-content').innerHTML = '<div style="text-align:center; color:#ff3333; font-family:monospace; padding:20px;">KAN DATA NIET LADEN</div>';
            }
        }

        function toggleWachtwoordZichtbaarheid() {
            const input = document.getElementById('wachtwoordInput');
            const icoon = document.getElementById('oogIcoon');

            if (input.type === 'password') {
                input.type = 'text';
                icoon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                input.type = 'password';
                icoon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        function verifieerWachtwoord() {
            const ww = document.getElementById('wachtwoordInput').value;
            const foutDiv = document.getElementById('foutMelding');

            if (ww === HET_WACHTWOORD) {
                foutDiv.style.display = 'none';
                window.open(DRIVE_MAP_URL, '_blank');
                document.getElementById('wachtwoordInput').value = '';
            } else {
                foutDiv.style.display = 'block';
            }
        }

        laadScoreboard();
        setInterval(laadScoreboard, 10000);
    </script>

</body>
</html>
